name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo build --release --workspace
      # Each OOXML crate must build on its own, not only through a feature
      # another workspace member turns on in a shared dependency (zip's
      # flate2 backend went missing that way).
      - run: for p in ooxml docx pptx xlsx; do cargo check -p "fluree-doc-$p" || exit 1; done
      - run: cargo test --workspace
      # Nothing in the workspace turns on the DOCX and XLSX crates' `ocr`
      # feature (the CLI reads pictures itself), so `parse_with_ocr` and its
      # tests build only here.
      - run: cargo test -p fluree-doc-docx -p fluree-doc-xlsx --features ocr
  # The built-in OCR engine end to end: the tests `cargo test` skips because
  # they need the asset pack, which is not in the repository. build.py makes
  # the pack from its publishers' files at pinned versions, checking every
  # hash; its download cache is kept between runs, keyed by build.py, so a
  # run downloads only when the pins change.
  ocr-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fdoc-ocr-assets
          key: fdoc-ocr-assets-${{ hashFiles('tools/ocr-assets/build.py') }}
      - run: python3 -I tools/ocr-assets/build.py "$RUNNER_TEMP/ocr-assets" --platforms linux-x64
      - run: cargo test -p fluree-doc-cli --test ocr_engine -- --ignored
        env:
          FDOC_OCR_MODELS: ${{ runner.temp }}/ocr-assets

  # Every fuzz target for a short, fixed time over its seeds: a reader that
  # panics, aborts, hangs or runs past its memory limit on an input a few
  # mutations from a seed fails here, before a long campaign finds it
  # (fuzz/README.md). Built once, for all targets; run one after the other,
  # every one of them whatever an earlier one found, the job failing at the
  # end if any did.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECONDS_EACH: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Build the targets
        working-directory: fuzz
        run: cargo fuzz build -O -a -s none
      - name: Run each target
        working-directory: fuzz
        run: |
          # Run apart from the loop, so that a list that fails, or names
          # nothing, fails the job rather than running no target.
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "::error::cargo fuzz list named no target"
            exit 1
          fi
          failed=""
          for t in $targets; do
            mkdir -p corpus/$t
            echo "::group::$t"
            cargo fuzz run "$t" corpus/$t seeds/$t -O -a -s none -- \
              -rss_limit_mb=320 -timeout=10 -max_len=262144 \
              -max_total_time=$SECONDS_EACH -print_final_stats=1 \
              || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets that failed:$failed"
            exit 1
          fi
      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
