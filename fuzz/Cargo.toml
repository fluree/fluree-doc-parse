[package]
name = "fluree-doc-parse-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fluree-doc-model = { path = "../crates/fluree-doc-model" }
fluree-doc-csv = { path = "../crates/fluree-doc-csv" }
fluree-doc-xls = { path = "../crates/fluree-doc-xls" }
fluree-doc-doc = { path = "../crates/fluree-doc-doc" }
fluree-doc-ppt = { path = "../crates/fluree-doc-ppt" }
fluree-doc-odf = { path = "../crates/fluree-doc-odf" }
fluree-doc-rtf = { path = "../crates/fluree-doc-rtf" }
fluree-doc-xps = { path = "../crates/fluree-doc-xps" }
fluree-doc-docx = { path = "../crates/fluree-doc-docx" }
fluree-doc-xlsx = { path = "../crates/fluree-doc-xlsx" }
fluree-doc-pptx = { path = "../crates/fluree-doc-pptx" }
fluree-doc-pdf = { path = "../crates/fluree-doc-pdf" }
fluree-doc-email = { path = "../crates/fluree-doc-email" }
fluree-doc-html = { path = "../crates/fluree-doc-html" }
fluree-doc-markdown = { path = "../crates/fluree-doc-markdown" }
fluree-doc-text = { path = "../crates/fluree-doc-text" }
fluree-doc-image = { path = "../crates/fluree-doc-image" }
fluree-doc-vision = { path = "../crates/fluree-doc-vision" }
# Without the built-in OCR engine: detection, and the conversion of a
# message's attachments, need none of it.
fluree-doc-cli = { path = "../crates/fluree-doc-cli", default-features = false }
hayro-syntax = "0.7"
serde_json = "1"

# Its own workspace, so the main build never compiles it (it needs nightly
# and libFuzzer) and `cargo fuzz` never builds the main workspace's members.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "csv"
path = "fuzz_targets/csv.rs"
test = false
doc = false
bench = false

