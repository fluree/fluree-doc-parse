[package]
name = "fluree-doc-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fluree-doc-model.workspace = true
quick-xml = "0.36"
fluree-doc-ooxml.workspace = true
fluree-doc-vision = { workspace = true, optional = true }
fluree-doc-image = { workspace = true, optional = true }

[dev-dependencies]
fluree-doc-model = { workspace = true, features = ["test-util"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Read the text in the sheets' pictures with an OCR engine
# (`parse_with_ocr`). Off by default: it brings in the PDF layout engine,
# which an XLSX reader otherwise does without.
ocr = ["dep:fluree-doc-vision", "dep:fluree-doc-image"]
